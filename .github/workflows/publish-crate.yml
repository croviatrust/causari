name: publish-crate

# Publishes `causari` to crates.io on every release tag via Trusted
# Publishing (OIDC): no long-lived token lives in this repository. The first
# release of a crate must be published by hand with an API token; after that,
# crates.io → causari → Settings → Trusted Publishing must list:
#   provider GitHub Actions · repository croviatrust/causari
#   workflow publish-crate.yml · environment crates-io
# Until that entry exists the auth step fails and nothing is published, which
# is the intended failure mode.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only run cargo publish --dry-run"
        type: boolean
        default: true
      mcp_only:
        description: "Publish server.json for a crate version already on crates.io. Does not run cargo publish."
        type: boolean
        default: false
      version:
        description: "Crate version server.json must name when mcp_only is true (for example 0.4.0)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.mcp_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="causari") | .version')"
          if [ "$TAG" != "$CRATE" ]; then
            echo "tag v$TAG does not match Cargo.toml version $CRATE" >&2
            exit 1
          fi
      - name: package builds from the crate tarball
        run: cargo publish --dry-run --locked --allow-dirty

  publish:
    needs: verify
    if: github.event_name == 'push' || (inputs.dry_run == false && inputs.mcp_only != true)
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Bootstrap path: crates.io requires the first version of a crate to be
      # published with an API token before Trusted Publishing can be enabled.
      # If the repository secret CARGO_REGISTRY_TOKEN exists it is used, once;
      # delete it after Trusted Publishing is configured and the OIDC path
      # below takes over. The secret never leaves GitHub.
      - name: choose credential
        id: cred
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing with the bootstrap API token; remove the secret once Trusted Publishing is configured"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.cred.outputs.mode == 'oidc'
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cred.outputs.mode == 'token' && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  # The registry entry points at the crate. Authentication is GitHub OIDC
  # for io.github.croviatrust; ownership of the cargo package is the
  # `mcp-name:` line in README.md as rendered on crates.io. A tag push
  # publishes server.json from that tag after cargo publish. mcp_only
  # publishes server.json from this workflow's ref for a version already on
  # crates.io: the tag is not moved and the crate is not published again.
  # The registry still validates the document.
  mcp-registry:
    needs: publish
    if: >-
      always() &&
      (
        (needs.publish.result == 'success' && inputs.mcp_only != true) ||
        (github.event_name == 'workflow_dispatch' && inputs.mcp_only == true)
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: server.json version matches the release
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            TAG="$RELEASE_VERSION"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be x.y.z" >&2; exit 1; }
          V="$(jq -r .version server.json)"
          P="$(jq -r '.packages[0].version' server.json)"
          [ "$V" = "$TAG" ] && [ "$P" = "$TAG" ] || { echo "server.json says $V/$P, release is $TAG" >&2; exit 1; }
          DESC="$(jq -r .description server.json)"
          [ "${#DESC}" -le 100 ] || { echo "description is ${#DESC} characters; the registry allows 100" >&2; exit 1; }
      - name: install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin mcp-publisher
          mcp-publisher --version
      - name: wait for crates.io to serve the new version
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            TAG="$RELEASE_VERSION"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          for i in $(seq 1 30); do
            if curl -fsSL -A "causari-ci (info@croviatrust.com)" "https://crates.io/api/v1/crates/causari/$TAG" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 20
          done
          echo "crates.io does not serve causari $TAG yet" >&2
          exit 1
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
