name: causari-audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: re audit reads every commit + git blame at HEAD.
          fetch-depth: 0

      # Dogfood the public composite action (uses prebuilt release binary,
      # falls back to cargo install before the first release exists).
      - uses: ./
