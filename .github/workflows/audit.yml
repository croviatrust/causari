name: causari-audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: re audit reads every commit + git blame at HEAD.
          fetch-depth: 0

      - name: Install Causari
        run: cargo install --git https://github.com/croviatrust/causari --locked

      - name: Run survival audit
        run: re audit --summary | tee audit-summary.md

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: causari-audit
          path: audit-summary.md
