name: dco

# Every commit in a pull request must carry a Signed-off-by trailer (DCO.md).
# Done in-repo with git alone so no third-party app needs access to the repo.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: check Signed-off-by on every commit
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            author_email="$(git show -s --format='%ae' "$sha")"
            author_name="$(git show -s --format='%an' "$sha")"
            # Automated dependency updates are not contributions under the DCO:
            # the bot cannot certify origin, and the change is a version string.
            case "$author_name" in
              dependabot\[bot\]|renovate\[bot\]|github-actions\[bot\]|causari-report\[bot\])
                echo "commit ${sha:0:10} by $author_name: automated, not subject to the DCO"
                continue ;;
            esac
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q .; then
              echo "::error::commit ${sha:0:10} has no Signed-off-by trailer ($author_name <$author_email>)"
              missing=1
            fi
            # GitHub's users.noreply.github.com addresses are a real identity; example.* is not.
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiE '@example\.(com|org|net)>?$'; then
              echo "::error::commit ${sha:0:10} is signed off with a placeholder identity"
              missing=1
            fi
          done < <(git rev-list --no-merges "${BASE}..${HEAD}")
          if [ "$missing" != "0" ]; then
            echo
            echo "Add the trailer to each commit with:  git commit -s   (or amend: git commit --amend -s --no-edit)"
            echo "Then force-push your branch. See DCO.md."
            exit 1
          fi
          echo "every commit in ${BASE:0:10}..${HEAD:0:10} is signed off"
