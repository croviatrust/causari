name: causari-guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Causari
        run: |
          if ! command -v re &> /dev/null; then
            cargo install --git https://github.com/croviatrust/causari --locked
          fi
        shell: bash

      - name: Run Guard
        run: |
          set -euo pipefail
          SUMMARY=$(re guard --summary -n "20" 2>&1 || true)
          echo "$SUMMARY"
          ALERTS=$(echo "$SUMMARY" | grep -c '🔴' || echo "0")
          WARNINGS=$(echo "$SUMMARY" | grep -c '🟡' || echo "0")
          if [ "$ALERTS" -gt 0 ]; then STATUS="❌ failing"
          elif [ "$WARNINGS" -gt 0 ]; then STATUS="⚠️ warnings"
          else STATUS="✅ passing"; fi
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            BODY="## Causari Guard — ${STATUS}

${SUMMARY}

<sub>Powered by [Causari Guard](https://github.com/croviatrust/causari-guard-action)</sub>"
            JSON_BODY=$(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))' <<< "$BODY")
            curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" -X POST \
              -d "{\"body\":$JSON_BODY}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" > /dev/null
            echo "Posted guard summary to PR #${{ github.event.pull_request.number }}"
          fi
          if [ "false" = "true" ] && [ "$ALERTS" -gt 0 ]; then
            echo "::error::Guard found $ALERTS alert(s)"
            exit 1
          fi
        shell: bash
