name: causari-guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Causari
        run: cargo install --git https://github.com/croviatrust/causari --locked
      - name: Run Guard
        run: re guard --summary -n 20 || true
