name: causari-guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: causari-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: causari-cli-${{ runner.os }}

      - name: Install Causari
        run: |
          if ! command -v re >/dev/null 2>&1; then
            cargo install --git https://github.com/croviatrust/causari --locked
          fi

      - name: Run Guard
        id: guard
        run: |
          set -euo pipefail
          re guard --summary -n 20 > guard-summary.md
          cat guard-summary.md
          if grep -q '🔴' guard-summary.md; then
            echo "status=alert" >> "$GITHUB_OUTPUT"
          elif grep -q '🟡' guard-summary.md; then
            echo "status=warn" >> "$GITHUB_OUTPUT"
          else
            echo "status=pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Post / update PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- causari-guard -->"
          {
            echo "$MARKER"
            cat guard-summary.md
            echo ""
            echo "<sub>Powered by [Causari Guard](https://github.com/croviatrust/causari-guard-action)</sub>"
          } > comment.md
          # Find an existing guard comment to edit (sticky), else create a new one.
          ID=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
                 --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${ID}" \
              -F body=@comment.md >/dev/null
            echo "Updated existing guard comment ($ID)."
          else
            gh pr comment "$PR" --body-file comment.md
            echo "Posted new guard comment."
          fi
