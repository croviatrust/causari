name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross (linux arm only)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: unit tests (native targets only)
        if: matrix.cross != true
        run: cargo test --release --target ${{ matrix.target }}

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: causari-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/causari
            target/${{ matrix.target }}/release/causari.exe
            target/${{ matrix.target }}/release/re
            target/${{ matrix.target }}/release/re.exe
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  # Every public surface against canon/canon.json: one version, no verdict
  # wording, same agent matrix in README and site, installers agree with the
  # release workflow, every internal link resolves. Offline; the live site is
  # audited weekly in surface-audit.yml.
  canon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/audit_surfaces.py --gate --quiet

  # The Survival Report generator and the Zenodo deposit: alphabetical rows,
  # exclusion rules, seeded intervals, Atom validity, redirects and sitemap,
  # no forbidden wording in generated pages. Standard library only.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  # The npm and PyPI launchers in packaging/: the Python one against a fake
  # downloader, the Node one against the real release named in package.json
  # (download, checksum, cache, tampered archive, exit codes).
  launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s packaging/pypi/tests -t packaging/pypi/tests -v
      - run: python3 -m pip install --upgrade build && python3 -m build --outdir /tmp/pypi-dist packaging/pypi
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: bash scripts/tests/test_npm_shim.sh
