name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: install cross (linux arm only)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Asset naming matches scripts/install.sh and scripts/install.ps1:
      #   re-<tag>-<target>.tar.gz (unix) / re-<tag>-<target>.zip (windows)
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/re-${TAG}-${{ matrix.target }}.zip" "./target/${{ matrix.target }}/release/re.exe"
          else
            tar -C "target/${{ matrix.target }}/release" -czf "dist/re-${TAG}-${{ matrix.target }}.tar.gz" re
          fi

      - name: upload artifact for checksums
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  checksums:
    name: publish SHA256SUMS.txt
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum re-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
