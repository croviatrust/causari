name: survival-leaderboard

# Weekly public leaderboard of AI code survival across notable open-source
# repositories. Every number is reproducible by anyone:
#   re audit <owner/repo> --json
on:
  schedule:
    - cron: "17 5 * * 1" # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: install latest re binary
        run: |
          set -euo pipefail
          TAG="$(gh release list --repo croviatrust/causari --limit 20 \
            --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          echo "installing re from release $TAG"
          gh release download "$TAG" --repo croviatrust/causari \
            --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir /tmp/causari
          tar -xzf /tmp/causari/*.tar.gz -C /tmp/causari
          BIN="$(find /tmp/causari -name re -type f | head -n1)"
          sudo install -m 0755 "$BIN" /usr/local/bin/re
          re --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: audit repositories
        run: |
          set -uo pipefail
          mapfile -t REPOS < <(grep -Ev '^\s*(#|$)' .github/leaderboard-repos.txt)
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo '[]' > /tmp/rows.json
          for repo in "${REPOS[@]}"; do
            echo "::group::auditing $repo"
            if timeout 3600 re audit "$repo" --json > /tmp/audit.json 2>/tmp/audit.err; then
              jq --arg repo "$repo" --arg at "$NOW" \
                '. + [{repo: $repo, audited_at: $at} + input]' \
                /tmp/rows.json /tmp/audit.json > /tmp/rows.next.json \
                && mv /tmp/rows.next.json /tmp/rows.json
            else
              echo "audit failed for $repo (skipped):"
              tail -n 3 /tmp/audit.err || true
            fi
            echo "::endgroup::"
          done
          jq '{generated_at: (.[0].audited_at // ""), tool: "causari", command: "re audit <owner/repo> --json", rows: (sort_by(-(.verified.introduced + .probable.introduced)))}' \
            /tmp/rows.json > site/survival-data.json
          jq -r '.rows[] | "\(.repo)\tverified:\(.verified.introduced) surv:\(.verified.surviving)\tprobable:\(.probable.introduced) surv:\(.probable.surviving)"' \
            site/survival-data.json

      - name: append weekly history
        run: |
          set -euo pipefail
          HIST_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/leaderboard-data/site/survival-history.json"
          if ! curl -fsSL "$HIST_URL" -o /tmp/history.json; then
            echo '[]' > /tmp/history.json
          fi
          jq --slurpfile cur site/survival-data.json '
            . + [{
              date: $cur[0].generated_at,
              rows: [$cur[0].rows[] | {
                repo,
                total_commits,
                verified: {
                  commits: .verified.commits,
                  introduced: .verified.introduced,
                  surviving: .verified.surviving,
                  survival_rate: .verified.survival_rate
                }
              }]
            }] | .[-104:]' /tmp/history.json > site/survival-history.json
          jq 'length' site/survival-history.json

      # main is a protected branch (strict CI required), so the refreshed data is
      # published to a dedicated data branch. The site fetches it from raw GitHub.
      - name: publish refreshed data
        run: |
          set -euo pipefail
          git config user.name "causari-leaderboard[bot]"
          git config user.email "bot@causari.dev"
          git checkout -B leaderboard-data
          git add site/survival-data.json site/survival-history.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore(leaderboard): weekly survival data refresh"
          git push --force origin leaderboard-data
