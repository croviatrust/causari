[package]
name = "causari"
version = "0.1.0"
edition = "2024"
description = "Causari — intent-addressable code: bidirectional causal version control for AI-agent actions"
license = "BUSL-1.1"
repository = "https://github.com/croviatrust/causari"
homepage = "https://causari.dev"
readme = "README.md"
keywords = ["agents", "version-control", "provenance", "mcp", "causality"]
categories = ["development-tools", "command-line-utilities"]
authors = ["Croviatrust <hello@croviatrust.com>"]
rust-version = "1.85"

[[bin]]
name = "re"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
colored = "2.1"
similar = "2.6"
notify = "6.1"
notify-debouncer-mini = "0.4"
ctrlc = "3.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
