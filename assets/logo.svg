<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Causari — intent-addressable code">
  <title>Causari</title>
  <desc>Causari logo: a horizontal causal chain — four gradient nodes connected by a line, ending in a cyan arrow, followed by the wordmark "Causari" and the tagline "intent-addressable code".</desc>

  <defs>
    <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="48" y1="110" x2="310" y2="110">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Causal chain: gradient polyline through four nodes -->
  <polyline points="48,110 112,110 176,110 240,110"
            stroke="url(#cg)" stroke-width="11" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>

  <!-- Nodes (white halo + colored core, increasing in prominence) -->
  <g>
    <circle cx="48"  cy="110" r="13" fill="#FFFFFF"/>
    <circle cx="48"  cy="110" r="8"  fill="#7C3AED"/>

    <circle cx="112" cy="110" r="13" fill="#FFFFFF"/>
    <circle cx="112" cy="110" r="8"  fill="#5B5DEE"/>

    <circle cx="176" cy="110" r="13" fill="#FFFFFF"/>
    <circle cx="176" cy="110" r="8"  fill="#3B82F6"/>

    <circle cx="240" cy="110" r="13" fill="#FFFFFF"/>
    <circle cx="240" cy="110" r="8"  fill="#22D3EE"/>
  </g>

  <!-- Arrow: extends right from last node, in cyan -->
  <path d="M 253 110 L 308 110 M 294 96 L 310 110 L 294 124"
        stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="334" y="128"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="800" font-size="78" letter-spacing="-2.5"
        fill="#0B1437">Causari</text>

  <!-- Tagline -->
  <text x="336" y="170"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="17" letter-spacing="2"
        fill="#5B5DEE">intent-addressable code</text>
</svg>
