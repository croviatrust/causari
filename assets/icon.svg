<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Causari icon">
  <title>Causari</title>
  <desc>Causari icon: causal chain of three nodes ending in an arrow on a navy tile, sized for favicon and GitHub avatar.</desc>

  <defs>
    <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="56" y1="128" x2="218" y2="128">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="50%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Rounded navy tile (high contrast across light & dark backgrounds) -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0B1437"/>

  <!-- Gradient causal polyline through the three nodes -->
  <polyline points="56,128 114,128 172,128"
            stroke="url(#cg)" stroke-width="16" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>

  <!-- Nodes (white halo + colored core) -->
  <g>
    <circle cx="56"  cy="128" r="22" fill="#FFFFFF"/>
    <circle cx="56"  cy="128" r="13" fill="#7C3AED"/>

    <circle cx="114" cy="128" r="22" fill="#FFFFFF"/>
    <circle cx="114" cy="128" r="13" fill="#3B82F6"/>

    <circle cx="172" cy="128" r="22" fill="#FFFFFF"/>
    <circle cx="172" cy="128" r="13" fill="#22D3EE"/>
  </g>

  <!-- Arrow head, in cyan, pointing right -->
  <path d="M 188 128 L 218 128 M 204 110 L 220 128 L 204 146"
        stroke="#22D3EE" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
