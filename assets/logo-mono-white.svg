<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Causari — intent-addressable code">
  <title>Causari (monochrome on dark)</title>
  <desc>Causari logo, white monochrome variant for dark backgrounds. Causal chain of four nodes ending in an arrow, followed by the wordmark.</desc>

  <polyline points="48,110 112,110 176,110 240,110"
            stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"
            stroke-linejoin="round" fill="none"/>

  <g fill="#FFFFFF">
    <circle cx="48"  cy="110" r="13"/>
    <circle cx="112" cy="110" r="13"/>
    <circle cx="176" cy="110" r="13"/>
    <circle cx="240" cy="110" r="13"/>
  </g>
  <g fill="#0B1437">
    <circle cx="48"  cy="110" r="6"/>
    <circle cx="112" cy="110" r="6"/>
    <circle cx="176" cy="110" r="6"/>
    <circle cx="240" cy="110" r="6"/>
  </g>

  <path d="M 253 110 L 308 110 M 294 96 L 310 110 L 294 124"
        stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="334" y="128"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="800" font-size="78" letter-spacing="-2.5"
        fill="#FFFFFF">Causari</text>

  <text x="336" y="170"
        font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
        font-size="17" letter-spacing="2"
        fill="#FFFFFF" opacity="0.85">intent-addressable code</text>
</svg>
